<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="/js/safeData.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23c94c5d' d='M16 2C12 9 5 15 5 21a11 11 0 0 0 22 0C27 15 20 9 16 2Z'/%3E%3C/svg%3E">
    <style>table { display: block; overflow-x: auto; } .modal-body { overflow-x: auto; } @media(max-width:600px) { .navbar-brand { font-size:1rem; } }</style>
    <title>Organiser Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-danger">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-calendar-check me-2"></i>Blood Donation System</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3">Organiser Portal - <span id="orgNameLabel"></span></span>
                <a class="btn btn-sm btn-outline-light" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row align-items-center mb-4">
            <div class="col-md-6"><h2>Camp Management</h2></div>
            <div class="col-md-6 text-md-end">
                <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#newCampModal"><i class="bi bi-plus-circle me-1"></i>Organise New Camp</button>
            </div>
        </div>
        <!-- Status legend -->
        <div class="mb-3">
            <small class="text-muted">Lifecycle: </small>
            <span class="badge bg-info">Draft</span> → <span class="badge bg-primary">Scheduled</span> → <span class="badge bg-success">Active</span> → <span class="badge bg-dark">Completed</span>
            <span class="ms-2">| <span class="badge bg-secondary">Cancelled</span></span>
        </div>
        <table class="table table-striped table-hover shadow-sm rounded">
            <thead class="table-dark">
                <tr><th>Camp Name</th><th>Location</th><th>Date</th><th>Capacity</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="campTableBody"></tbody>
        </table>
    </div>

    <!-- New Camp Modal -->
    <div class="modal fade" id="newCampModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-danger">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-calendar-plus me-2"></i>Organise New Camp</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form onsubmit="createCamp(event)">
                        <div class="mb-3"><label class="form-label">Camp Name</label><input type="text" class="form-control" id="cName" required></div>
                        <div class="mb-3"><label class="form-label">Location</label><input type="text" class="form-control" id="cLoc" required></div>
                        <div class="row mb-3">
                            <div class="col"><label class="form-label">Date</label><input type="date" class="form-control" id="cDate" required></div>
                            <div class="col"><label class="form-label">Time</label><input type="time" class="form-control" id="cTime" required></div>
                        </div>
                        <div class="mb-3"><label class="form-label">Capacity</label><input type="number" class="form-control" id="cCap" value="50" required></div>
                        <button type="submit" class="btn btn-danger w-100">Create Camp</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Registrations Modal -->
    <div class="modal fade" id="regModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Camp Registrations</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body"><table class="table table-sm"><thead><tr><th>Donor</th><th>Blood Type</th><th>Date</th><th>Status</th></tr></thead><tbody id="regTableBody"></tbody></table></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let token = sessionStorage.getItem('token');
        if (!token) window.location.href = '/';
        document.getElementById('orgNameLabel').textContent = sessionStorage.getItem('userName') || '';
        const H = { 'Authorization': 'Bearer ' + token };

        function statusBadge(s) {
            const map = {Draft:'bg-info',Scheduled:'bg-primary',Active:'bg-success',Completed:'bg-dark',Cancelled:'bg-secondary'};
            return `<span class="badge ${map[s]||'bg-secondary'}">${s}</span>`;
        }

        function nextActions(camp) {
            const s = camp.status, id = camp.campId;
            let btns = '';
            if (s === 'Draft') btns += `<button class="btn btn-sm btn-outline-primary me-1" onclick="changeStatus('${id}','Scheduled')"><i class="bi bi-megaphone me-1"></i>Schedule</button>`;
            if (s === 'Scheduled') btns += `<button class="btn btn-sm btn-outline-success me-1" onclick="changeStatus('${id}','Active')"><i class="bi bi-play-circle me-1"></i>Activate</button>`;
            if (s === 'Active') btns += `<button class="btn btn-sm btn-outline-dark me-1" onclick="changeStatus('${id}','Completed')"><i class="bi bi-check-circle me-1"></i>Complete</button>`;
            if (s === 'Active' || s === 'Scheduled') btns += `<button class="btn btn-sm btn-outline-info me-1" onclick="viewRegistrations('${id}')"><i class="bi bi-people me-1"></i>Registrations</button>`;
            if (s !== 'Completed' && s !== 'Cancelled') btns += `<button class="btn btn-sm btn-outline-danger" onclick="changeStatus('${id}','Cancelled')"><i class="bi bi-x-circle me-1"></i>Cancel</button>`;
            return btns;
        }

        function loadCamps() {
            fetch('/api/camps?size=100&mine=true', { headers: H }).then(r => r.json()).then(data => {
                const tb = document.getElementById('campTableBody'); tb.innerHTML = '';
                (data.content || data).forEach(c => {
                    tb.innerHTML += `<tr>
                        <td class="fw-bold">${c.name}</td><td>${c.location}</td><td>${c.date}</td><td>${c.capacity}</td>
                        <td>${statusBadge(c.status)}</td>
                        <td>${nextActions(c)}</td></tr>`;
                });
            }).catch(e => console.error(e));
        }

        function changeStatus(id, newStatus) {
            if (!confirm(`Change camp status to "${newStatus}"?`)) return;
            fetch('/api/camps/' + id + '/status', {
                method: 'PATCH', headers: { ...H, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            }).then(r => {
                if (!r.ok) return r.json().then(e => { throw new Error(e.message || 'Failed'); });
                return r.json();
            }).then(d => { alert('Camp is now: ' + d.status); loadCamps(); })
              .catch(e => alert(e.message));
        }

        function createCamp(event) {
            event.preventDefault();
            fetch('/api/camps', {
                method: 'POST', headers: { ...H, 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: document.getElementById('cName').value, location: document.getElementById('cLoc').value, date: document.getElementById('cDate').value, time: document.getElementById('cTime').value + ":00", capacity: document.getElementById('cCap').value })
            }).then(r => { if(!r.ok) return r.json().then(e => { throw new Error(e.message||'Failed'); }); return r.json(); })
              .then(d => { alert('Camp created! ID: '+d.campId); bootstrap.Modal.getInstance(document.getElementById('newCampModal')).hide(); loadCamps(); })
              .catch(e => alert(e.message));
        }

        function viewRegistrations(id) {
            fetch('/api/camps/'+id+'/registrations', { headers: H }).then(r => r.json()).then(data => {
                const tb = document.getElementById('regTableBody'); tb.innerHTML = '';
                if (data.length === 0) tb.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No registrations yet</td></tr>';
                data.forEach(r => { tb.innerHTML += `<tr><td>${r.donorName}</td><td>${r.bloodType}</td><td>${r.registrationDate}</td><td><span class="badge bg-info">${r.status}</span></td></tr>`; });
                new bootstrap.Modal(document.getElementById('regModal')).show();
            });
        }

        function logout() { sessionStorage.clear(); window.location.href = '/'; }
        loadCamps();
    </script>
    <script>
        document.querySelectorAll('label').forEach(label => {
            const input = label.nextElementSibling;
            if (input && input.id) label.htmlFor = input.id;
        });
        document.querySelectorAll('input[type=password]').forEach(input => {
            input.autocomplete = input.id.includes('reg') ? 'new-password' : 'current-password';
        });
        document.querySelectorAll('input[type=email]').forEach(input => input.autocomplete = 'email');
    </script>
</body>
</html>
