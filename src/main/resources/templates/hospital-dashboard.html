<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hospital Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-danger">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-hospital me-2"></i>Blood Donation System</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3">Hospital Portal - <span id="hospitalNameLabel"></span></span>
                <a class="btn btn-sm btn-outline-light" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row align-items-center mb-4">
            <div class="col-md-6">
                <h2>Blood Requests &amp; Status</h2>
            </div>
            <div class="col-md-6 text-md-end">
                <button class="btn btn-outline-danger me-2" onclick="searchInventory()"><i class="bi bi-search me-1"></i>Search Available Blood Inventory</button>
                <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#requestModal"><i class="bi bi-activity me-1"></i>Request Blood with Severity</button>
            </div>
        </div>

        <table class="table table-striped table-hover shadow-sm border mt-3">
            <thead class="table-dark">
                <tr>
                    <th>Request ID</th>
                    <th>Date</th>
                    <th>Blood Type</th>
                    <th>Quantity (Units)</th>
                    <th>Severity</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="requestTableBody">
            </tbody>
        </table>
    </div>

    <!-- Request Modal -->
    <div class="modal fade" id="requestModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-danger">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-activity me-2"></i>Create Blood Request</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form onsubmit="handleRequest(event)">
                        <div class="mb-3">
                            <label class="form-label">Blood Type</label>
                            <select class="form-select" id="reqBloodType" required>
                                <option value="A+">A+</option><option value="A-">A-</option>
                                <option value="B+">B+</option><option value="B-">B-</option>
                                <option value="O+">O+</option><option value="O-">O-</option>
                                <option value="AB+">AB+</option><option value="AB-">AB-</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantity Needed</label>
                            <input type="number" class="form-control" id="reqQuantity" value="5" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Severity Level</label>
                            <select class="form-select" id="reqSeverity" required>
                                <option value="Critical">Critical (Immediate Fulfillment)</option>
                                <option value="Urgent">Urgent</option>
                                <option value="Routine">Routine (General Restock)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Submit Request</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Inventory Search Modal -->
    <div class="modal fade" id="inventoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-search me-2"></i>Global Inventory Check</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center" id="inventoryResult">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentHospitalId = localStorage.getItem('userId');
        let token = localStorage.getItem('token');
        let hospitalName = localStorage.getItem('userName');

        if (!currentHospitalId || !token) {
            window.location.href = '/';
        }
        document.getElementById('hospitalNameLabel').textContent = hospitalName || 'Hospital';

        loadRequests();

        function loadRequests() {
            if (!currentHospitalId) return;
            fetch('/api/hospitals/' + currentHospitalId + '/requests', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
                .then(res => {
                    if (!res.ok) throw new Error('Failed to load requests');
                    return res.json();
                })
                .then(data => {
                    const tbody = document.getElementById('requestTableBody');
                    tbody.innerHTML = '';
                    data.forEach(req => {
                        let badgeClass = req.status === 'Pending' ? 'bg-warning text-dark' : (req.status === 'Fulfilled' ? 'bg-success' : 'bg-secondary');
                        let severityClass = req.severity === 'Critical' ? 'text-danger fw-bold' : (req.severity === 'Urgent' ? 'text-warning fw-bold' : '');
                        tbody.innerHTML += `
                            <tr>
                                <td>#REQ-${req.requestId ? req.requestId.substring(0,8) : ''}</td>
                                <td>${req.requestDate}</td>
                                <td class="fw-bold">${req.bloodType}</td>
                                <td>${req.quantity}</td>
                                <td class="${severityClass}">${req.severity}</td>
                                <td><span class="badge ${badgeClass}">${req.status}</span></td>
                            </tr>
                        `;
                    });
                })
                .catch(err => console.error(err));
        }

        function searchInventory() {
            fetch('/api/inventory/stock', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
                .then(res => {
                    if (!res.ok) throw new Error('Failed to fetch inventory');
                    return res.json();
                })
                .then(data => {
                    let html = '<div class="row row-cols-3 g-2">';
                    for (const [bloodType, qty] of Object.entries(data)) {
                        html += `<div class="col"><div class="border p-2 rounded">
                                 <strong>${bloodType}</strong><br>${qty} Units</div></div>`;
                    }
                    html += '</div>';
                    document.getElementById('inventoryResult').innerHTML = html;
                    new bootstrap.Modal(document.getElementById('inventoryModal')).show();
                })
                .catch(err => alert(err.message));
        }

        function handleRequest(event) {
            event.preventDefault();
            const payload = {
                bloodType: document.getElementById('reqBloodType').value,
                quantity: document.getElementById('reqQuantity').value,
                severity: document.getElementById('reqSeverity').value
            };

            fetch('/api/hospitals/' + currentHospitalId + '/requests', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(payload)
            }).then(res => {
                if (!res.ok) throw new Error('Failed to register request');
                return res.json();
            }).then(data => {
                alert('Request Registered successfully! ID: ' + data.requestId);
                bootstrap.Modal.getInstance(document.getElementById('requestModal')).hide();
                loadRequests();
            }).catch(err => alert(err.message));
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }
    </script>
</body>
</html>
