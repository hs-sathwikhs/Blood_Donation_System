<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="/js/safeData.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23c94c5d' d='M16 2C12 9 5 15 5 21a11 11 0 0 0 22 0C27 15 20 9 16 2Z'/%3E%3C/svg%3E">
    <style>table { display: block; overflow-x: auto; } .modal-body { overflow-x: auto; } @media(max-width:600px) { .navbar-brand { font-size:1rem; } }</style>
    <title>Donor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-danger">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-droplet-fill me-2"></i>Blood Donation System</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3">Donor Portal - Welcome <span id="donorNameLabel"></span></span>
                <a class="btn btn-sm btn-outline-light" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row align-items-center mb-4">
            <div class="col-md-6">
                <h2>Available Camps</h2>
            </div>
            <div class="col-md-6 text-md-end">
                <button class="btn btn-outline-info me-2" onclick="checkEligibility()"><i class="bi bi-clipboard-check me-1"></i>Check Eligibility</button>
                <button class="btn btn-outline-danger me-2" onclick="viewHistory()"><i class="bi bi-clock-history me-1"></i>View Donation History</button>
                <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#donateModal"><i class="bi bi-heart-pulse me-1"></i>Donate Blood</button>
            </div>
        </div>

        <div class="d-flex flex-wrap gap-2 mb-3">
            <input id="campSearch" type="search" class="form-control" placeholder="Search name or location" aria-label="Search camps" oninput="renderCamps()">
            <input id="campDate" type="date" class="form-control" aria-label="Camp date" onchange="renderCamps()">
            <select id="campState" class="form-select" aria-label="Camp status" onchange="renderCamps()"><option value="">All states</option><option>Active</option><option>Scheduled</option><option>Completed</option><option>Cancelled</option></select>
        </div>
        <table class="table table-striped table-hover shadow-sm rounded">
            <thead class="table-dark">
                <tr>
                    <th>Camp Name</th>
                    <th>Location</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Places left</th><th>Action</th>
                </tr>
            </thead>
            <tbody id="campTableBody">
            </tbody>
        </table>
    </div>

    <section class="container mt-4"><h3>My registrations</h3><ul id="registrationList" class="list-group"></ul></section>

    <!-- History Modal -->
    <div class="modal fade" id="historyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Past Donations</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="list-group" id="historyList"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Donate Modal -->
    <div class="modal fade" id="donateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-danger">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-heart-pulse me-2"></i>Record Donation</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form onsubmit="handleDonate(event)">
                        <div class="mb-3">
                            <label class="form-label">Select Camp you attended</label>
                            <select class="form-select" id="campSelect" required>
                                <option value="">Loading camps...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Units Donated (Pints)</label>
                            <input type="number" class="form-control" id="quantityInput" value="1.0" step="0.5" min="0.5" max="1.0" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Submit Record</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let token = sessionStorage.getItem('token');
        let currentDonorId = sessionStorage.getItem('userId');
        let donorName = sessionStorage.getItem('userName');

        if (!token || !currentDonorId) {
            window.location.href = '/';
        }
        document.getElementById('donorNameLabel').textContent = donorName || '';

        let camps = [], registrations = [];
        async function loadCamps() {
            const headers = {Authorization: 'Bearer ' + token};
            const [campRes, regRes] = await Promise.all([fetch('/api/camps?size=100', {headers}), fetch('/api/donors/' + currentDonorId + '/registrations', {headers})]);
            camps = (await campRes.json()).content;
            registrations = await regRes.json();
            renderCamps();
            document.getElementById('registrationList').innerHTML = registrations.map(r => `<li class="list-group-item">${r.name} - ${r.date}: ${r.status} ${r.status === 'Registered' && r.campStatus !== 'Completed' ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelRegistration('${r.campId}')">Cancel</button>` : ''}</li>`).join('') || '<li class="list-group-item">No registrations yet.</li>';
        }
        function renderCamps() {
            const query = document.getElementById('campSearch').value.toLowerCase();
            const date = document.getElementById('campDate').value;
            const state = document.getElementById('campState').value;
            document.getElementById('campTableBody').innerHTML = camps.filter(c => (c.name + ' ' + c.location).toLowerCase().includes(query) && (!date || c.date === date) && (!state || c.status === state)).map(c => {
                const reg = registrations.find(r => r.campId === c.campId && r.status !== 'Cancelled');
                const open = ['Active', 'Scheduled'].includes(c.status) && c.date >= new Date().toLocaleDateString('en-CA') && c.remaining > 0;
                return `<tr><td>${c.name}</td><td>${c.location}</td><td>${c.date}</td><td>${c.status}</td><td>${c.remaining}</td><td>${reg ? reg.status : open ? `<button class="btn btn-sm btn-outline-danger" onclick="registerForCamp('${c.campId}')">Register</button>` : 'Closed'}</td></tr>`;
            }).join('') || '<tr><td colspan="6">No camps match.</td></tr>';
            document.getElementById('campSelect').innerHTML = '<option value="">Select camp</option>' + camps.filter(c => c.status === 'Active' && c.date === new Date().toLocaleDateString('en-CA') && registrations.some(r => r.campId === c.campId && r.status === 'Registered')).map(c => `<option value="${c.campId}">${c.name}</option>`).join('');
        }
        function cancelRegistration(campId) {
            fetch('/api/donors/' + currentDonorId + '/registrations/' + campId, {method:'DELETE', headers:{Authorization:'Bearer '+token}}).then(r => r.json()).then(d => {alert(d.message);loadCamps();});
        }
        loadCamps();

        function registerForCamp(campId) {
            fetch('/api/donors/register-camp', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ donorId: currentDonorId, campId: campId })
            }).then(res => {
                if (!res.ok) throw new Error('Registration failed');
                return res.text();
            }).then(msg => {alert(msg);loadCamps();}).catch(err => alert(err.message));
        }

        function handleDonate(event) {
            event.preventDefault();
            const campId = document.getElementById('campSelect').value;
            const quantity = document.getElementById('quantityInput').value;

            fetch('/api/donors/donate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ donorId: currentDonorId, campId: campId, quantity: quantity })
            }).then(res => {
                if (!res.ok) throw new Error('Donation recording failed');
                return res.text();
            }).then(msg => {
                alert(msg);
                bootstrap.Modal.getInstance(document.getElementById('donateModal')).hide();
            }).catch(err => alert(err.message));
        }

        function viewHistory() {
            fetch('/api/donors/' + currentDonorId + '/donations', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
                .then(res => {
                    if (!res.ok) throw new Error('Failed to load history');
                    return res.json();
                })
                .then(donations => {
                    const list = document.getElementById('historyList');
                    list.innerHTML = '';
                    if (donations.length === 0) list.innerHTML = '<li class="list-group-item">No donations on record.</li>';

                    donations.forEach(d => {
                        list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                            Donated ${d.quantity} unit(s) of ${d.bloodType}
                            <span class="badge bg-secondary rounded-pill">${d.donationDate}</span>
                        </li>`;
                    });
                    new bootstrap.Modal(document.getElementById('historyModal')).show();
                }).catch(err => alert(err.message));
        }

        function checkEligibility() {
            fetch('/api/donors/' + currentDonorId + '/eligibility', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => res.json())
            .then(eligible => {
                if (eligible) {
                    alert('You are ELIGIBLE to donate blood.');
                } else {
                    alert('You are NOT eligible to donate at this time. (Age or 90-day rule)');
                }
            }).catch(err => alert(err.message));
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '/';
        }
    </script>
    <script>
        document.querySelectorAll('label').forEach(label => {
            const input = label.nextElementSibling;
            if (input && input.id) label.htmlFor = input.id;
        });
        document.querySelectorAll('input[type=password]').forEach(input => {
            input.autocomplete = input.id.includes('reg') ? 'new-password' : 'current-password';
        });
        document.querySelectorAll('input[type=email]').forEach(input => input.autocomplete = 'email');
    </script>
</body>
</html>
